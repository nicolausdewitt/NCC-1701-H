[workspace]
members = [
    "apps/ncc-bridge/src-tauri",
    "crates/ncc-core",
    "crates/ncc-orchestrator",
    "crates/ncc-warpcore",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
repository = "https://github.com/nicolausdewitt/NCC-1701-H"

[workspace.dependencies]
ncc-core = { path = "crates/ncc-core" }
ncc-orchestrator = { path = "crates/ncc-orchestrator" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }
uuid = { version = "1.24.0", features = ["v4", "serde"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
